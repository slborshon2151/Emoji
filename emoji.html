<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Premium Emoji Creator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0e1621;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h3 { margin: 0 0 10px 0; font-weight: 500; color: #5288c1; text-align: center; }
        textarea {
            width: 100%;
            height: 120px;
            background: #17212b;
            color: #fff;
            border: 1px solid #24303f;
            border-radius: 10px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: #5288c1; }
        .section-title { font-size: 14px; color: #708499; margin: 15px 0 8px 0; font-weight: bold; }
        .emoji-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            overflow-y: auto;
            flex-grow: 1;
            padding-bottom: 70px;
        }
        .emoji-card {
            background: #17212b;
            border: 1px solid #24303f;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 26px;
            text-align: center;
            transition: all 0.2s ease;
            user-select: none;
        }
        .emoji-card:active {
            background: #24303f;
            transform: scale(0.95);
        }
        .btn-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0e1621;
            padding: 10px 15px;
            box-sizing: border-box;
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button:active { background: #1f71b2; }
    </style>
</head>

                // কার্সরের পজিশনে কাস্টম ইমোজি ট্যাগ পুশ করা
                const startPos = postText.selectionStart;
                const endPos = postText.selectionEnd;
                const text = postText.value;
                const emojiTag = `<tg-emoji emoji-id="${emoji.id}">${emoji.symbol}</tg-emoji>`;
                
                postText.value = text.substring(0, startPos) + emojiTag + text.substring(endPos);
                postText.focus();
                postText.selectionStart = postText.selectionEnd = startPos + emojiTag.length;
            };
